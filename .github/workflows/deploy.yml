name: Deploy

# Publishes the web app to the Cloudflare Worker pagework-app
# (app.pagework.dev), only after CI has passed for a push to main.
# Setup: docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run again by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs for pushes to this repository's main branch. A pull request
    # from a fork whose branch is also called "main" must never deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and publish the Worker
        # Wrangler is Cloudflare's command-line tool, pinned and run with npx
        # so it isn't a project dependency. It reads wrangler.jsonc, builds
        # the app and uploads apps/web/dist.
        run: npx --yes wrangler@4.162.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
