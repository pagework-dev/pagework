name: Deploy

# Publishes the web app to Cloudflare Pages at app.pagework.dev, only after
# CI has passed for a push to main. One-off setup: docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run again by hand, e.g. after changing the Cloudflare settings.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs for pushes to this repository's main branch. A pull request
    # from a fork whose branch is also called "main" must never deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.pagework.dev
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the Pages project if it doesn't exist yet
        run: |
          if npx --yes wrangler@4.162.0 pages project list | grep -qw "pagework-app"; then
            echo "The Pages project pagework-app exists."
          else
            npx --yes wrangler@4.162.0 pages project create pagework-app --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish to Cloudflare Pages
        # Wrangler is Cloudflare's command-line tool, pinned and run with npx
        # so it isn't a project dependency.
        run: >-
          npx --yes wrangler@4.162.0 pages deploy apps/web/dist
          --project-name=pagework-app
          --branch=main
          --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}
          --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
