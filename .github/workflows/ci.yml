name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install poppler for the PDF image comparison
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for the browser tests
        run: pnpm --filter @pagework/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # ARCHITECTURE.md, Performance budgets, on a generated 120-page script with
  # Chromium's CPU throttled 4x. Its own job, so a budget miss is reported
  # separately from correctness. Until 0.3 a miss is reported as a warning
  # and doesn't fail the build: the keystroke budget isn't met yet (see
  # pull request 12). Remove continue-on-error to make the budgets blocking.
  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the browser tests
        run: pnpm --filter @pagework/web exec playwright install --with-deps chromium
      - name: Check the budgets
        id: budgets
        continue-on-error: true
        run: pnpm perf
      - name: Report budgets not met
        if: steps.budgets.outcome == 'failure'
        run: echo "::warning title=Performance budgets not met::One or more budgets in ARCHITECTURE.md failed. See the 'Check the budgets' step for the numbers."
